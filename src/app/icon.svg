<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Shield/Protection Outline -->
  <path d="M256 72 C330 72 390 90 410 120 C410 270 340 370 256 420 C172 370 102 270 102 120 C122 90 182 72 256 72 Z"
        fill="none" stroke="#4F7668" stroke-width="14" stroke-opacity="0.4" stroke-dasharray="12 8" />

  <!-- Botanical Sprout / Leaf Group -->
  <g transform="translate(0, 10)">
    <!-- Central Stem -->
    <path d="M256 380 Q256 260 256 160" fill="none" stroke="url(#leafGrad)" stroke-width="24" stroke-linecap="round" />

    <!-- Left Main Leaf -->
    <path d="M256 270 C170 260 110 180 130 110 C210 110 250 190 256 270 Z" fill="url(#leafGrad)" />

    <!-- Right Accent Leaf -->
    <path d="M256 220 C330 210 380 140 360 80 C290 80 258 150 256 220 Z" fill="url(#leafGrad)" opacity="0.9" />

    <!-- Leaf Vein Detail -->
    <path d="M256 270 C210 220 170 170 145 130" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" opacity="0.3" />
    <path d="M256 220 C295 180 330 135 345 100" fill="none" stroke="#166534" stroke-width="6" stroke-linecap="round" opacity="0.3" />

    <!-- Small Terracotta Sprout Badge Dot -->
    <circle cx="360" cy="360" r="28" fill="url(#terracottaGrad)" />
    <path d="M352 360 L358 366 L370 354" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
